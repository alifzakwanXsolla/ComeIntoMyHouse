<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel test room</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family:"Press Start 2P"; src:url(assets/vendor/fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Silkscreen"; src:url(assets/vendor/fonts/silkscreen-latin-400-normal.woff2) format("woff2"); }
  html, body { margin:0; height:100%; background:#0b0708; overflow:hidden; }
  #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #help { position:fixed; left:8px; bottom:6px; font:10px monospace; color:#8a7f8f; pointer-events:none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="help">WASD / arrows move &middot; Shift sneak &middot; F flashlight &middot; E interact &middot; H hide pose &middot; L lights on/off</div>
<script src="assets/vendor/phaser.min.js"></script>
<script type="module" src="src/testroom/main.js"></script>
</body>
</html>
