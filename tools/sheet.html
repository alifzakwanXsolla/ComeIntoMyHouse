<!doctype html><meta charset="utf-8"><body style="background:#333;margin:0">
<canvas id="c"></canvas>
<script>
const p = new URLSearchParams(location.search);
const src = p.get('s') || '../assets/kenney/roguelike-indoors/Tilesheets/roguelikeIndoor_transparent.png';
const S = +(p.get('z') || 3), r0 = +(p.get('r0') || 0), r1 = +(p.get('r1') || 99), c0 = +(p.get('c0') || 0), c1 = +(p.get('c1') || 99);
const img = new Image(); img.src = src;
img.onload = () => {
  const cols = Math.floor((img.width + 1) / 17), rows = Math.floor((img.height + 1) / 17);
  const rr = Math.min(rows, r1) - r0; const cc = Math.min(cols, c1) - c0;
  const c = document.getElementById('c'); const cell = 16 * S + 14;
  c.width = cc * cell; c.height = rr * cell;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = '#556'; x.fillRect(0, 0, c.width, c.height);
  x.font = '10px monospace';
  for (let j = 0; j < rr; j++) for (let k = 0; k < cc; k++) {
    const i = k + c0; const row = j + r0;
    x.drawImage(img, i * 17, row * 17, 16, 16, k * cell + 7, j * cell + 12, 16 * S, 16 * S);
    x.fillStyle = '#ff0'; x.fillText(row * cols + i, k * cell + 2, j * cell + 10);
  }
};
</script>
